<!DOCTYPE html>
<html>
<body>
<script>
// بمجرد تحميل هذه الصفحة، نحاول إرسال أي بيانات موجودة في الرابط (query string) أو postMessage إلى النافذة الأم
if (window.opener && !window.opener.closed) {
    // إرسال أي رمز محتمل (مثلا نبحث عن معامل code في الـ URL)
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    if (code) {
        window.opener.postMessage({ type: 'auth_code', code: code }, 'https://fadyashraf44.github.io');
    } else {
        // أحياناً الرمز يُرسل عبر postMessage من مزود الهوية لهذه الصفحة، فنقوم بإعادة توجيهه
        window.addEventListener('message', function(e) {
            // إعادة إرسال أي رسالة للوالد
            window.opener.postMessage(e.data, 'https://fadyashraf44.github.io');
        });
    }
}
</script>
</body>
</html>
